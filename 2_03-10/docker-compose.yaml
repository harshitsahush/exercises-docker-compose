services:
  frontend:
    image: harshitsahush/frontend
    ports:
      - 5001:5001
      
  backend:
    image: harshitsahush/backend
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - 8080:8080
    depends_on:
      - redis
      
  redis:
    image: redis:7.4-alpine
    
