services:
  frontend:
    image: harshitsahush/frontend
    environment:
      - REACT_APP_BACKEND_URL=http://localhost:8000/api

  backend:
    image: harshitsahush/backend
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=db
      - REQUEST_ORIGIN=http://localhost:8000

  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
    container_name: db
    volumes:
      - ./database:/var/lib/postgresql

  redis:
    image: redis

  nginx:
    image: nginx:alpine
    ports:
      - 8000:80
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - frontend
      - backend
