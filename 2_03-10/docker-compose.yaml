services:
  frontend:
    image: harshitsahush/frontend
    ports:
      - 5001:5001
      
  backend:
    image: harshitsahush/backend
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REQUEST_ORIGIN=http://localhost:5001
      - POSTGRES_HOST=db
    ports:
      - 8080:8080

  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
    container_name: db
    volumes:
      - ./database:/var/lib/postgresql

  redis:
    image: redis
